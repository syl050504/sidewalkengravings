<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Concrete Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
    <style>
        .jersey-20-regular {
            font-family: "Jersey 20", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        
        .NAME {
            width: 100%;
            font-family: "Jersey 20", sans-serif;
            font-weight: 400;
            font-size: 70px;
            letter-spacing: 2px;
            margin: 0;
            color: rgba(0, 0, 0, 0.2);
            text-shadow: -1px -1px 1px rgba(0, 0, 0, 0.5),
                1px 1px 1px rgba(255, 255, 255, 0.3);
        }
        body {
            background-color: #81827f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            padding: 0 20px;
            gap: 20px;
            box-sizing: border-box;
        }

        .box-background {
            text-decoration: none;
            display: inline-block;
        }

        .box-groove {
            position: relative;
            background-color: transparent;
            width: 200px;
            padding: 24px 60px;
            text-align: center;
            border-width: 8px;
            border-style: groove;
            border-color: #a9aaa5;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s linear 150ms;
        }

        .box-groove:active {
            background-color: #999a95;
            transition: background-color 0s;
        }


        .box-groove::after {
            content: "";
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-width: 9px;
            border-style: groove;
            border-color: rgba(125, 126, 121, 0.4);
            mix-blend-mode: difference;
            pointer-events: none;
        }

        /* Style for the title text */

        .Title {
            font-family: "Jersey 20", sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 70px;
            letter-spacing: 2px;
            margin: 0;
            color: rgba(0, 0, 0, 0.2);
            text-shadow: -1px -1px 1px rgba(0, 0, 0, 0.5), 1px 1px 1px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <a href="history.html" class="box-background" onclick="event.preventDefault(); setTimeout(() => window.location.href = this.href, 250);">
            <div class="box-groove">
                <h1 class="Title">History</h1>
            </div>
        </a>

        <a href="archive.html" class="box-background" onclick="event.preventDefault(); setTimeout(() => window.location.href = this.href, 250);">
            <div class="box-groove">
                <h1 class="Title">Archive</h1>
            </div>
        </a>

        <a href="create.html" class="box-background" onclick="event.preventDefault(); setTimeout(() => window.location.href = this.href, 250);">
            <div class="box-groove">
                <h1 class="Title">Create</h1>
            </div>
        </a>
    </div>

</body>
</html>
